name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Python checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Lua checks
        run: |
          lua5.4 tests/model_test.lua
          lua5.4 tests/options_test.lua
          lua5.4 tests/transport_test.lua
          lua5.4 tests/service_test.lua
